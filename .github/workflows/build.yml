name: Build
on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    name: Build (${{ matrix.variant }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        variant:
          - default

    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create devcontainer
        uses: devcontainers/ci@v0.3
        with:
          configFile: .devcontainer/.devcontainer.json
          imageName: ghcr.io/${{ github.repository_owner }}/fluxpico_devcontainer
          cacheFrom: ghcr.io/${{ github.repository_owner }}/fluxpico_devcontainer
          push: always

      - name: Build FluxPico (${{ matrix.variant }})
        uses: devcontainers/ci@v0.3
        with:
          configFile: .devcontainer/.devcontainer.json
          imageName: ghcr.io/${{ github.repository_owner }}/fluxpico_devcontainer
          runCmd: |
            cd /workspaces/1541-FluxPico/firmware
            cmake --preset default
            cmake --build --preset default --config Release

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: FluxPico-binaries-${{ matrix.variant }}
          path: |
            firmware/build/1541-FluxPico.uf2
            firmware/build/1541-FluxPico.elf
